<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
  <title>Hand-drawn 3D sketch of an antenna sending a signal</title>

  <!-- small 3D base, like a radio module -->
  <path d="M40 76 L68 76 L68 94 L40 94 Z" fill="currentColor" opacity="0.14" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
  <path d="M32 82 L60 82 L68 76 L40 76 Z" fill="currentColor" opacity="0.07" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
  <rect x="32" y="82" width="28" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
  <rect x="33.5" y="83.5" width="25" height="15" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-linejoin="round" />

  <!-- mast -->
  <path d="M46 82 V22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="46" cy="18" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4" />

  <!-- signal, broadcasting up and to the right -->
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <path d="M54 13 A9 9 0 0 1 59 20" />
    <path d="M58 7 A17 17 0 0 1 66 21" />
    <path d="M62 1 A25 25 0 0 1 73 22" />
  </g>
</svg>
