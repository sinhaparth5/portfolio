<svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="signalDoodleTitle">
  <title id="signalDoodleTitle">Hand-drawn sketch of a small hardware radio module with an antenna, broadcasting a signal toward a letter</title>

  <!-- hardware base module, 3D -->
  <path d="M98 196 L168 196 L168 242 L98 242 Z" fill="currentColor" opacity="0.14" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M80 210 L150 210 L168 196 L98 196 Z" fill="currentColor" opacity="0.07" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="80" y="210" width="70" height="46" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" />
  <rect x="82" y="212" width="66" height="42" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.35" stroke-linejoin="round" />
  <circle cx="97" cy="228" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />

  <!-- legs -->
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <path d="M98 256 V270" />
    <path d="M115 256 V272" />
    <path d="M132 256 V270" />
  </g>

  <!-- mast -->
  <path d="M115 210 V80" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="115" cy="73" r="6" fill="none" stroke="currentColor" stroke-width="2.6" />

  <!-- signal, broadcasting toward the letter -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M132 58 A16 16 0 0 1 140 74" />
    <path d="M140 43 A30 30 0 0 1 158 76" />
    <path d="M148 28 A44 44 0 0 1 176 78" />
  </g>

  <!-- the letter, riding the signal -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="178" y="76" width="46" height="32" rx="3" stroke-width="2.4" />
    <path d="M178 78 L201 96 L224 78" stroke-width="2" />
  </g>
</svg>
