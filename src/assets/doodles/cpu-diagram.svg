<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cpuDiagramTitle">
  <title id="cpuDiagramTitle">Hand-drawn labeled diagram of a CPU package: die cores and cache, heat spreader, substrate, and contact pads</title>
  <defs>
    <marker id="cpu-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2b2a28" />
    </marker>
  </defs>

  <text x="24" y="46" font-family="Kalam, cursive" font-weight="700" font-size="34" fill="#6a4fc0">CPU</text>
  <text x="24" y="66" font-family="Patrick Hand, cursive" font-style="italic" font-size="13" fill="#6e6a5e">not remotely to scale</text>

  <!-- substrate (PCB) -->
  <rect x="170" y="250" width="200" height="60" rx="6" fill="#3f8a5c" stroke="#1f4d33" stroke-width="3" />
  <rect x="171" y="251" width="198" height="58" rx="6" fill="none" stroke="#1f4d33" stroke-width="1.2" opacity="0.35" />
  <path d="M330,258 L344,272 M338,256 L352,270 M346,254 L358,266" stroke="#1f4d33" stroke-width="1.4" opacity="0.5" />

  <!-- contact pads -->
  <g fill="#d4af37" stroke="#96792a" stroke-width="1.5">
    <rect x="190" y="306" width="8" height="16" rx="1.5" />
    <rect x="206" y="306" width="8" height="16" rx="1.5" />
    <rect x="222" y="306" width="8" height="16" rx="1.5" />
    <rect x="238" y="306" width="8" height="16" rx="1.5" />
    <rect x="254" y="306" width="8" height="16" rx="1.5" />
    <rect x="270" y="306" width="8" height="16" rx="1.5" />
    <rect x="286" y="306" width="8" height="16" rx="1.5" />
    <rect x="302" y="306" width="8" height="16" rx="1.5" />
    <rect x="318" y="306" width="8" height="16" rx="1.5" />
    <rect x="334" y="306" width="8" height="16" rx="1.5" />
    <rect x="350" y="306" width="8" height="16" rx="1.5" />
  </g>

  <!-- heat spreader (IHS) -->
  <rect x="200" y="150" width="140" height="100" rx="8" fill="#dde1e4" stroke="#8a8f94" stroke-width="3" />
  <rect x="201" y="151" width="138" height="98" rx="8" fill="none" stroke="#8a8f94" stroke-width="1.2" opacity="0.4" />
  <path d="M300,220 L316,236 M308,216 L324,232 M292,224 L308,240" stroke="#8a8f94" stroke-width="1.4" opacity="0.55" />

  <!-- zoom connector to die detail -->
  <path d="M340,152 L332,150" stroke="#2b2a28" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
  <path d="M336,246 L332,152" stroke="#2b2a28" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />

  <!-- die detail inset -->
  <rect x="330" y="28" width="170" height="124" rx="8" fill="#fdfcf9" stroke="#2b2a28" stroke-width="2" stroke-dasharray="6 5" />

  <g fill="#e3d9f7" stroke="#6a4fc0" stroke-width="2">
    <rect x="342" y="40" width="40" height="34" rx="4" />
    <rect x="390" y="40" width="40" height="34" rx="4" />
    <rect x="438" y="40" width="40" height="34" rx="4" />
    <rect x="342" y="82" width="40" height="34" rx="4" />
    <rect x="390" y="82" width="40" height="34" rx="4" />
    <rect x="438" y="82" width="40" height="34" rx="4" />
  </g>
  <path d="M350,48 L358,56 M356,48 L364,56" stroke="#6a4fc0" stroke-width="1.3" opacity="0.55" />

  <rect x="342" y="118" width="136" height="26" rx="4" fill="#d3ecdd" stroke="#2f7d57" stroke-width="2" />
  <path d="M350,122 L350,140 M356,122 L356,140 M362,122 L362,140" stroke="#2f7d57" stroke-width="1.2" opacity="0.5" />

  <!-- labels -->
  <text x="504" y="54" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2a28">cores</text>
  <path d="M500,50 C 492,50 486,54 480,58" stroke="#2b2a28" stroke-width="1.6" fill="none" marker-end="url(#cpu-arrow)" />

  <text x="504" y="134" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2a28">shared cache</text>
  <path d="M500,130 C 492,130 486,131 480,132" stroke="#2b2a28" stroke-width="1.6" fill="none" marker-end="url(#cpu-arrow)" />

  <text x="20" y="136" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2a28">heat spreader</text>
  <text x="20" y="154" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2a28">(IHS)</text>
  <path d="M150,146 C 172,146 186,156 198,168" stroke="#2b2a28" stroke-width="1.6" fill="none" marker-end="url(#cpu-arrow)" />

  <text x="20" y="278" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2a28">substrate (PCB)</text>
  <path d="M154,272 C 160,273 164,274 168,275" stroke="#2b2a28" stroke-width="1.6" fill="none" marker-end="url(#cpu-arrow)" />

  <text x="20" y="342" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2a28">contact pads</text>
  <path d="M118,336 C 150,336 176,328 196,320" stroke="#2b2a28" stroke-width="1.6" fill="none" marker-end="url(#cpu-arrow)" />
</svg>
